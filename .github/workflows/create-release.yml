name: Create release

on:
  workflow_dispatch:

# Serialize version allocation across all manual runs.
concurrency:
  group: create-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  create:
    name: Create the next release from main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/main ]]; then
            echo '::error::Run Create release with main selected in Use workflow from.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch current main and release branches
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Prepare version bump commit
        id: prepare
        run: python .github/scripts/prepare_release.py
      - name: Push the new branch
        if: steps.prepare.outputs.created == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
        # An empty lease requires the remote ref to be absent, even if another actor creates it meanwhile.
        run: git push --force-with-lease="refs/heads/$RELEASE_BRANCH:" origin "HEAD:refs/heads/$RELEASE_BRANCH"
      - name: Start Android and iOS release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
        # Pushes authenticated with GITHUB_TOKEN do not trigger push workflows; dispatch does.
        run: gh workflow run release.yml --ref "$RELEASE_BRANCH"
      - name: Release started
        env:
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          printf '\nRelease started for [%s](%s/tree/%s). Follow [Release runs](%s/actions/workflows/release.yml).\n' \
            "$RELEASE_BRANCH" "$REPOSITORY_URL" "$RELEASE_BRANCH" "$REPOSITORY_URL" >> "$GITHUB_STEP_SUMMARY"
