name: PR checks

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  shared:
    name: Lint, unit and shared E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew ktlintCheck test :composeApp:jvmTest -x :androidApp:processDebugGoogleServices
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-jvm-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  web-chromium:
    name: Web Chromium P0/P1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - run: chmod +x ./gradlew
      - run: npm ci
        working-directory: e2e/web
      - run: npx playwright install --with-deps chromium
        working-directory: e2e/web
      - run: npm run test:chromium
        working-directory: e2e/web
      - name: Upload Web videos and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-web-chromium
          path: |
            e2e/web/test-results/
            e2e/web/playwright-report/
            firebase-debug.log
            database-debug.log
          if-no-files-found: ignore

  android-p0:
    name: Android API 24 P0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - run: chmod +x ./gradlew
      - name: Decode Android Firebase config
        run: echo "${{ secrets.FIREBASE_CONFIG_ANDROID }}" | base64 --decode > androidApp/google-services.json
      - name: Export Firebase project ID
        run: echo "E2E_FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' androidApp/google-services.json)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: e2e/web
      - name: Install FFmpeg for Android video normalization
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Run actual MainActivity against Firebase Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            nohup e2e/web/node_modules/.bin/firebase emulators:start --project "$E2E_FIREBASE_PROJECT_ID" --only database > firebase-emulator.log 2>&1 &
            timeout 60 sh -c 'until curl --fail --silent http://127.0.0.1:4400/emulators; do sleep 1; done'
            curl --fail --silent http://127.0.0.1:4400/emulators
            bash e2e/record-android-e2e.sh android-api24.mp4 \
              ./gradlew :androidApp:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.e2eScreenRecording=true
      - name: Upload Android video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-android-api24
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            ${{ runner.temp }}/e2e-recordings/
            firebase-emulator.log
            firebase-debug.log
            database-debug.log
          if-no-files-found: ignore

  ios-build:
    name: iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Decode iOS Firebase config
        run: echo "${{ secrets.FIREBASE_CONFIG_IOS }}" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
