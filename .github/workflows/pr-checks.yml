name: PR checks

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Kotlin lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew ktlintCheck

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      # Compile without Firebase credentials; this APK is not distributed.
      - run: ./gradlew :androidApp:assembleDebug -x :androidApp:processDebugGoogleServices

  desktop-build:
    name: Desktop build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew :composeApp:jvmJar

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew :composeApp:jsBrowserProductionWebpack

  ios-build:
    name: iOS framework build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64
