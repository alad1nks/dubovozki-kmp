name: Android CI

on:
  push:
    branches:
      - main

jobs:
  quality:
    name: Main lint, unit, shared and Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - run: chmod +x ./gradlew
      - run: ./gradlew ktlintCheck test :composeApp:jvmTest -x :androidApp:processDebugGoogleServices
      - run: npm ci
        working-directory: e2e/web
      - run: npx playwright install --with-deps chromium
        working-directory: e2e/web
      - run: npm run test:chromium
        working-directory: e2e/web
      - name: Upload main E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-e2e-diagnostics
          path: |
            e2e/web/test-results/
            e2e/web/playwright-report/
            **/build/reports/tests/
          if-no-files-found: ignore

  android-e2e:
    name: Main Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json
      - run: chmod +x ./gradlew
      - name: Decode Firebase config
        run: echo "${{ secrets.FIREBASE_CONFIG_ANDROID }}" | base64 --decode > androidApp/google-services.json
      - name: Export Firebase project ID
        run: echo "E2E_FIREBASE_PROJECT_ID=$(jq -r '.project_info.project_id' androidApp/google-services.json)" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: e2e/web
      - name: Run actual MainActivity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            nohup e2e/web/node_modules/.bin/firebase emulators:start --project "$E2E_FIREBASE_PROJECT_ID" --only database > firebase-emulator.log 2>&1 &
            timeout 60 sh -c 'until curl --fail --silent http://127.0.0.1:4400/emulators; do sleep 1; done'
            curl --fail --silent http://127.0.0.1:4400/emulators
            ./gradlew :androidApp:connectedDebugAndroidTest
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-android-api${{ matrix.api }}
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
            firebase-emulator.log
          if-no-files-found: ignore

  build:
    needs: [quality, android-e2e]
    runs-on: macos-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Firebase config
        run: |
          echo "${{ secrets.FIREBASE_CONFIG_ANDROID }}" | base64 -d > androidApp/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dubovozki-release-key.jks

      - name: Run local tests
        run: ./gradlew test

      - name: Build APK
        run: ./gradlew assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: success()

      - name: Rename APK
        run: mv androidApp/build/outputs/apk/release/androidApp-release.apk androidApp/build/outputs/apk/release/dubovozki.apk
        if: success()

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: androidApp/build/outputs/apk/release/dubovozki.apk
        if: success()

  post-build:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout io repository
        uses: actions/checkout@v4
        with:
          repository: 'alad1nks/alad1nks.github.io'
          token: ${{ secrets.ACCESS_TOKEN }}

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dubovozki

      - name: Commit APK
        run: |
          git config --local user.name 'alad1nks'
          git config --local user.email 'alad1nks@users.noreply.github.com'
          git add dubovozki/*.apk
          git commit -m 'Add generated APK file'
          git push
