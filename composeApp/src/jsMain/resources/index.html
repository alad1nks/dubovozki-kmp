<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дубовозки</title>
    <link type="text/css" rel="stylesheet" href="styles.css">

    <script>
        var currentLanguagesImplementation = Object.getOwnPropertyDescriptor(Navigator.prototype, "languages");
        var newLanguagesImplementation = Object.assign({}, currentLanguagesImplementation, {
            get: function () {
                if (window.__customLocale) {
                    return [window.__customLocale];
                } else {
                    return currentLanguagesImplementation.get.apply(this);
                }
            }
        });

        Object.defineProperty(Navigator.prototype, "languages", newLanguagesImplementation)
        Object.defineProperty(window, "__customLocale", {
            configurable: true,
            get: function () { return window.__localeValue; },
            set: function (value) {
                window.__localeValue = value;
                var language = (value || navigator.language || "ru").replace(/_/g, "-").split("-")[0].toLowerCase();
                document.documentElement.lang = ["ru", "en", "kk"].includes(language) ? language : "ru";
                document.title = language === "en" ? "Dubovozki" : language === "kk" ? "Дубовозкалар" : "Дубовозки";
            }
        });
    </script>
    <script src="skiko.js"></script>

    <script type="module">
        import { firebaseConfig } from './firebaseConfig.js';
        window.firebaseConfig = firebaseConfig;
    </script>

    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
</body>
</html>
